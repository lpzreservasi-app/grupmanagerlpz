<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rombongan Manager V2 - Booking & Billing</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#6b7280;--line:#e5e7eb;--primary:#176b5b;--primary2:#0f594b;--danger:#b42318;--warn:#b54708;--ok:#027a48;--shadow:0 8px 28px rgba(16,24,40,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:250px;background:#123f37;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:800;padding:8px 10px 24px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:4px}.nav button{display:block;width:100%;border:0;background:transparent;color:#d8ebe7;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}.stat b{font-size:28px;display:block;margin-top:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:9px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--danger)}.btn.small{padding:6px 9px;font-size:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.table th{color:#667085;font-weight:600}.badge{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.badge.green{background:#ecfdf3;color:#027a48}.badge.yellow{background:#fffaeb;color:#b54708}.badge.red{background:#fef3f2;color:#b42318}.badge.gray{background:#f2f4f7;color:#475467}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.section{margin-top:18px}.section h3{font-size:15px;margin:0 0 12px}.hidden{display:none!important}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.doc{background:white;max-width:850px;margin:0 auto;padding:55px;border:1px solid var(--line);box-shadow:var(--shadow);min-height:1050px}.dochead{display:flex;justify-content:space-between;border-bottom:2px solid #123f37;padding-bottom:18px;margin-bottom:28px}.doc h2{text-align:center;margin:28px 0}.doc table{width:100%;border-collapse:collapse}.doc td,.doc th{border:1px solid #bbb;padding:8px}.right{text-align:right}.doc p{line-height:1.6}.notice{padding:12px 14px;border-radius:9px;background:#eff8ff;color:#175cd3;font-size:13px;margin-bottom:14px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:900px){.side{width:200px}.main{margin-left:200px;width:calc(100% - 200px);padding:18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{position:static;width:100%;min-height:auto}.app{display:block}.main{margin:0;width:100%}.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.side,.top,.toolbar,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.doc{border:0;box-shadow:none;margin:0;max-width:none;padding:25mm 20mm;min-height:0}}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#123f37,#176b5b);padding:24px}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.login-brand{text-align:center;margin-bottom:24px}.login-brand h1{margin:0;color:#123f37;font-size:25px}.login-brand p{margin:7px 0 0;color:#667085;font-size:13px}
.login-card .field{margin-bottom:15px}.login-card .btn{width:100%;padding:11px}.login-error{display:none;background:#fef3f2;color:#b42318;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.user-chip{display:inline-flex;align-items:center;gap:7px;background:#eef6f4;color:#123f37;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}
.logout-btn{margin-left:8px}

</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <h1>Rombongan Manager</h1>
      <p>Group Booking & Billing</p>
    </div>
    <div id="loginError" class="login-error">Username atau password salah.</div>
    <form id="loginForm">
      <div class="field"><label>Username</label><input id="loginUsername" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit">Login</button>
    </form>
    <div class="muted" style="margin-top:16px;font-size:11px;line-height:1.6">
      Default: <b>superadmin / admin123</b> · <b>user / user123</b>
    </div>
  </div>
</div>

<div id="appShell" class="app hidden">
<aside class="side">
  <div class="brand">Rombongan Manager<small>Group Booking & Billing</small></div>
  <div class="nav">
    <button data-page="dashboard" class="active">Dashboard</button>
    <button data-page="groups">Data Rombongan</button>
    <button data-page="products" data-role="superadmin">Produk & Harga</button>
    <button data-page="documents">Dokumen</button>
    <button data-page="settings" data-role="superadmin">Pengaturan</button>
  </div>
</aside>
<main class="main">
  <div id="topUserBar" style="display:flex;justify-content:flex-end;margin-bottom:10px"></div>
  <div id="app"></div>
</main>
</div>

<script>
const KEY='rombongan_manager_v2';
const seed={
  company:{name:'Lembang Park & Zoo',address:'Alamat perusahaan / destinasi',phone:'',email:''},
  products:[
    {id:'p1',name:'Tiket Dewasa',category:'Tiket',unit:'pax',price:50000,active:true},
    {id:'p2',name:'Tiket Anak',category:'Tiket',unit:'pax',price:35000,active:true},
    {id:'p3',name:'Tiket Pelajar',category:'Tiket',unit:'pax',price:30000,active:true},
    {id:'p4',name:'Paket Makan A',category:'Makan',unit:'pax',price:25000,active:true},
    {id:'p5',name:'Paket Makan B',category:'Makan',unit:'pax',price:30000,active:true},
    {id:'p6',name:'Feeding Animal',category:'Add-on',unit:'pax',price:25000,active:true},
    {id:'p7',name:'Animal Encounter',category:'Add-on',unit:'pax',price:50000,active:true},
    {id:'p8',name:'Guide',category:'Add-on',unit:'unit',price:300000,active:true}
  ],
  groups:[]
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
if(!db.products) db.products=seed.products;
if(!db.company) db.company=seed.company;
if(!db.groups) db.groups=[];
let page='dashboard', editing=null, docType=null;
const USERS = {
  superadmin:{username:'superadmin',password:'admin123',role:'superadmin',name:'Superadmin'},
  user:{username:'user',password:'user123',role:'user',name:'User Biasa'}
};
let currentUser = JSON.parse(sessionStorage.getItem('rombongan_current_user')||'null');

function isSuperAdmin(){ return currentUser?.role==='superadmin'; }
function requireSuperAdmin(){
  if(!isSuperAdmin()){
    alert('Akses hanya untuk Superadmin.');
    page='dashboard';
    layout();
    return false;
  }
  return true;
}
function showLogin(){
  $('#loginScreen').classList.remove('hidden');
  $('#appShell').classList.add('hidden');
  $('#loginUsername').focus();
}
function showApp(){
  $('#loginScreen').classList.add('hidden');
  $('#appShell').classList.remove('hidden');
  renderUserBar();
  applyRoleAccess();
  layout();
}
function renderUserBar(){
  $('#topUserBar').innerHTML = currentUser
    ? `<span class="user-chip">👤 ${esc(currentUser.name)} · ${currentUser.role==='superadmin'?'Superadmin':'User Biasa'}</span><button class="btn small logout-btn" onclick="logout()">Logout</button>`
    : '';
}
function applyRoleAccess(){
  document.querySelectorAll('[data-role="superadmin"]').forEach(el=>{
    el.style.display=isSuperAdmin()?'':'none';
  });
}
function login(username,password){
  const found=Object.values(USERS).find(u=>u.username===username && u.password===password);
  if(!found)return false;
  currentUser={username:found.username,role:found.role,name:found.name};
  sessionStorage.setItem('rombongan_current_user',JSON.stringify(currentUser));
  return true;
}
function logout(){
  sessionStorage.removeItem('rombongan_current_user');
  currentUser=null;
  page='dashboard';
  showLogin();
}


const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const fmtDate=s=>!s?'-':new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
const productById=id=>db.products.find(p=>p.id===id);
const itemCalc=i=>{
  const qty=+i.qty||0, price=+i.price||0;
  const gross=qty*price;
  const discountType=i.discountType||'amount';
  const discountValue=Math.max(0,+i.discount||0);
  const discount=discountType==='percent' ? Math.min(gross,gross*discountValue/100) : Math.min(gross,discountValue);
  return {gross,discount,total:Math.max(0,gross-discount)};
};
const calcGroup=g=>{
  const items=g.items||[];
  const subtotal=items.reduce((a,i)=>a+itemCalc(i).gross,0);
  const itemDiscount=items.reduce((a,i)=>a+itemCalc(i).discount,0);
  const discount=+g.discount||0, tax=+g.tax||0;
  const total=Math.max(0,subtotal-itemDiscount-discount+tax);
  return {subtotal,itemDiscount,discount,tax,total,dp:+g.dp||0,balance:Math.max(0,total-(+g.dp||0))};
};
function statusBadge(s){let c=s==='Confirmed'||s==='Invoiced'?'green':s==='Cancelled'?'red':s==='Offering'?'yellow':'gray';return `<span class="badge ${c}">${esc(s)}</span>`}
function layout(){
  if(page==='dashboard')dashboard();
  if(page==='groups')groups();
  if(page==='products')products();
  if(page==='documents')documents();
  if(page==='settings')settings();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
}
function dashboard(){
  const gs=db.groups, totals=gs.reduce((a,g)=>a+calcGroup(g).total,0), confirmed=gs.filter(g=>['Confirmed','Invoiced'].includes(g.status)).length;
  const ticket=gs.reduce((a,g)=>a+(g.items||[]).filter(i=>productById(i.productId)?.category==='Tiket').reduce((x,i)=>x+(+i.qty||0),0),0);
  const meal=gs.reduce((a,g)=>a+(g.items||[]).filter(i=>productById(i.productId)?.category==='Makan').reduce((x,i)=>x+(+i.qty||0),0),0);
  $('#app').innerHTML=`
  <div class="top"><div><h1>Dashboard</h1><div class="muted">Kelola rombongan, produk, harga, dokumen dan pembayaran.</div></div><button class="btn primary" onclick="newGroup()">+ Rombongan Baru</button></div>
  <div class="grid">
    <div class="card stat">Total Rombongan<b>${gs.length}</b></div>
    <div class="card stat">Confirmed<b>${confirmed}</b></div>
    <div class="card stat">Nilai Booking<b>${rupiah(totals)}</b></div>
    <div class="card stat">Tiket Terjual<b>${ticket}</b></div>
  </div>
  <div class="grid" style="margin-top:16px">
    <div class="card stat">Pax Makan<b>${meal}</b></div>
    <div class="card stat">Produk Aktif<b>${db.products.filter(p=>p.active).length}</b></div>
    <div class="card stat">Proforma/Invoice<b>${gs.filter(g=>['Confirmed','Invoiced'].includes(g.status)).length}</b></div>
    <div class="card stat">Outstanding<b>${rupiah(gs.reduce((a,g)=>a+calcGroup(g).balance,0))}</b></div>
  </div>
  <div class="card" style="margin-top:18px"><h3>Alur Kerja</h3><div class="toolbar">
    <span class="badge gray">1. Input Booking</span><span>→</span><span class="badge yellow">2. Offering</span><span>→</span>
    <span class="badge green">3. Confirmation</span><span>→</span><span class="badge green">4. Proforma</span><span>→</span><span class="badge green">5. Invoice</span>
  </div></div>
  <div class="card" style="margin-top:18px"><h3>Rombongan Terbaru</h3>${groupTable(gs.slice().sort((a,b)=>(b.created||'').localeCompare(a.created)).slice(0,8))}</div>`;
}
function groupTable(gs){
 if(!gs.length)return '<div class="empty">Belum ada data rombongan.</div>';
 return `<div class="tablewrap"><table class="table"><thead><tr><th>No. Booking</th><th>Rombongan</th><th>Tanggal</th><th>Pax</th><th>Item</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
 ${gs.map(g=>{let c=calcGroup(g);return `<tr><td>${esc(g.code)}</td><td><b>${esc(g.name)}</b><div class="muted">${esc(g.company||'')}</div></td><td>${fmtDate(g.date)}</td><td>${g.pax||0}</td><td>${(g.items||[]).length}</td><td>${rupiah(c.total)}</td><td>${statusBadge(g.status)}</td><td><button class="btn small" onclick="editGroup('${g.id}')">Edit</button> <button class="btn small" onclick="openDocs('${g.id}')">Dokumen</button></td></tr>`}).join('')}
 </tbody></table></div>`;
}
function groups(){
 $('#app').innerHTML=`<div class="top"><div><h1>Data Rombongan</h1><div class="muted">Satu booking dapat berisi banyak tiket, makanan dan add-on.</div></div><button class="btn primary" onclick="newGroup()">+ Rombongan Baru</button></div>
 <div class="card"><div class="toolbar"><input id="search" placeholder="Cari booking, nama, perusahaan..." style="flex:1;min-width:240px;padding:9px;border:1px solid #d0d5dd;border-radius:8px" oninput="filterGroups()">
 <select id="statusFilter" onchange="filterGroups()" class="btn"><option value="">Semua status</option><option>Draft</option><option>Offering</option><option>Confirmed</option><option>Invoiced</option><option>Cancelled</option></select></div><div id="groupRows">${groupTable(db.groups)}</div></div>`;
}
function filterGroups(){
 const q=$('#search').value.toLowerCase(),s=$('#statusFilter').value;
 const gs=db.groups.filter(g=>(!s||g.status===s)&&JSON.stringify(g).toLowerCase().includes(q));
 $('#groupRows').innerHTML=groupTable(gs);
}
function newGroup(){
 editing=null;
 showForm({id:crypto.randomUUID(),code:'GRP-'+new Date().getFullYear()+'-'+String(db.groups.length+1).padStart(4,'0'),status:'Draft',pax:0,discount:0,tax:0,dp:0,items:[],created:new Date().toISOString()});
}
function editGroup(id){editing=id;showForm(db.groups.find(g=>g.id===id));}
function itemRows(items){
 if(!items.length)return '<div class="empty" style="padding:25px">Belum ada item. Tambahkan tiket, makan atau add-on.</div>';
 return `<div class="tablewrap"><table class="table"><thead><tr><th>Produk</th><th>Kategori</th><th>Qty</th><th>Harga</th><th>Subtotal</th><th></th></tr></thead><tbody>
 ${items.map((i,idx)=>{let p=productById(i.productId);return `<tr><td>${esc(p?.name||i.name||'Produk')}</td><td>${esc(p?.category||'')}</td><td><input type="number" min="0" value="${i.qty||0}" onchange="updateItem(${idx},'qty',this.value)" style="width:85px;padding:6px;border:1px solid #d0d5dd;border-radius:7px"></td><td><input type="number" min="0" value="${i.price||0}" onchange="updateItem(${idx},'price',this.value)" style="width:130px;padding:6px;border:1px solid #d0d5dd;border-radius:7px"></td><td>${rupiah((+i.qty||0)*(+i.price||0))}</td><td><button class="btn small danger" onclick="removeItem(${idx})">Hapus</button></td></tr>`}).join('')}</tbody></table></div>`;
}
let formItems=[];
function showForm(g){
 formItems=JSON.parse(JSON.stringify(g.items||[]));
 const c=calcGroup({...g,items:formItems});
 $('#app').innerHTML=`<div class="top"><div><h1>${editing?'Edit':'Input'} Rombongan</h1><div class="muted">Masukkan data customer lalu pilih produk dan jumlah pesanan.</div></div></div>
 <div class="card"><form id="groupForm"><div class="formgrid">
 <div class="field"><label>No. Booking</label><input name="code" value="${esc(g.code)}" required></div>
 <div class="field"><label>Status</label><select name="status">${['Draft','Offering','Confirmed','Invoiced','Cancelled'].map(x=>`<option ${x===g.status?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Nama Rombongan</label><input name="name" value="${esc(g.name||'')}" required></div>
 <div class="field"><label>Instansi / Perusahaan</label><input name="company" value="${esc(g.company||'')}"></div>
 <div class="field"><label>Contact Person</label><input name="contact" value="${esc(g.contact||'')}"></div>
 <div class="field"><label>No. WhatsApp / Telepon</label><input name="phone" value="${esc(g.phone||'')}"></div>
 <div class="field"><label>Email</label><input type="email" name="email" value="${esc(g.email||'')}"></div>
 <div class="field"><label>Tanggal Kunjungan</label><input type="date" name="date" value="${esc(g.date||'')}"></div>
 <div class="field"><label>Jumlah Peserta</label><input type="number" min="0" name="pax" value="${g.pax||0}"></div>
 <div class="field"><label>Diskon</label><input type="number" min="0" name="discount" value="${g.discount||0}"></div>
 <div class="field"><label>Pajak / Biaya Tambahan</label><input type="number" min="0" name="tax" value="${g.tax||0}"></div>
 <div class="field"><label>DP / Uang Muka</label><input type="number" min="0" name="dp" value="${g.dp||0}"></div>
 <div class="field"><label>Jatuh Tempo</label><input type="date" name="due" value="${esc(g.due||'')}"></div>
 <div class="field full"><label>Catatan / Permintaan Khusus</label><textarea name="notes">${esc(g.notes||'')}</textarea></div>
 </div>
 <div class="section"><h3>Detail Pesanan</h3>
   <div class="toolbar"><select id="addProduct" style="min-width:260px;padding:9px;border:1px solid #d0d5dd;border-radius:8px">${db.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.category)} — ${esc(p.name)} (${rupiah(p.price)}/${esc(p.unit)})</option>`).join('')}</select>
   <input id="addQty" type="number" min="1" value="1" style="width:100px;padding:9px;border:1px solid #d0d5dd;border-radius:8px"><button type="button" class="btn primary" onclick="addItem()">+ Tambah Item</button></div>
   <div id="itemsArea">${itemRows(formItems)}</div>
 </div>
 <div class="card" style="margin-top:16px;background:#f8fafc;box-shadow:none"><div class="formgrid">
  <div><div class="muted">Subtotal</div><b id="sumSubtotal">${rupiah(c.subtotal)}</b></div>
  <div><div class="muted">Diskon Item</div><b id="sumItemDiscount">${rupiah(c.itemDiscount)}</b></div>
   <div><div class="muted">Diskon Booking</div><b id="sumDiscount">${rupiah(c.discount)}</b></div>
  <div><div class="muted">Pajak/Biaya</div><b id="sumTax">${rupiah(c.tax)}</b></div>
  <div><div class="muted">Grand Total</div><b id="sumTotal" style="font-size:22px">${rupiah(c.total)}</b></div>
  <div><div class="muted">DP</div><b id="sumDP">${rupiah(c.dp)}</b></div>
  <div><div class="muted">Outstanding</div><b id="sumBalance" style="font-size:22px">${rupiah(c.balance)}</b></div>
 </div></div>
 <div class="actions"><button type="button" class="btn" onclick="page='groups';layout()">Batal</button><button class="btn primary">Simpan Rombongan</button></div></form></div>`;
}
function refreshItems(){
 $('#itemsArea').innerHTML=itemRows(formItems);
 const f=new FormData($('#groupForm')), g=Object.fromEntries(f);
 const c=calcGroup({...g,items:formItems});
 $('#sumSubtotal').textContent=rupiah(c.subtotal); $('#sumDiscount').textContent=rupiah(+g.discount||0);
 $('#sumTax').textContent=rupiah(+g.tax||0); $('#sumTotal').textContent=rupiah(c.total); $('#sumDP').textContent=rupiah(+g.dp||0); $('#sumBalance').textContent=rupiah(c.balance);
}
function addItem(){
  let id=$('#addProduct').value,p=productById(id),qty=+$('#addQty').value||1;
  if(!p)return;
  formItems.push({productId:id,qty,price:p.price,discountType:'amount',discount:0});
  refreshItems();
}
function removeItem(i){formItems.splice(i,1);refreshItems();}
function updateItem(i,k,v){
  if(k==='discountType') formItems[i][k]=v;
  else formItems[i][k]=Math.max(0,+v||0);
  refreshItems();
}
function products(){ if(!requireSuperAdmin()) return;
 $('#app').innerHTML=`<div class="top"><div><h1>Master Produk & Harga</h1><div class="muted">Atur harga tiket, makan dan add-on yang otomatis tersedia saat membuat booking.</div></div><button class="btn primary" onclick="newProduct()">+ Produk</button></div>
 <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Produk</th><th>Kategori</th><th>Satuan</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
 ${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${esc(p.unit)}</td><td>${rupiah(p.price)}</td><td>${p.active?'<span class="badge green">Aktif</span>':'<span class="badge gray">Nonaktif</span>'}</td><td><button class="btn small" onclick="editProduct('${p.id}')">Edit</button> <button class="btn small" onclick="toggleProduct('${p.id}')">${p.active?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}
 </tbody></table></div></div>`;
}
function newProduct(){ if(!requireSuperAdmin()) return;productForm({id:crypto.randomUUID(),name:'',category:'Tiket',unit:'pax',price:0,active:true},false);}
function editProduct(id){ if(!requireSuperAdmin()) return;productForm(db.products.find(p=>p.id===id),true);}
function productForm(p,isEdit){ if(!requireSuperAdmin()) return;
 $('#app').innerHTML=`<div class="top"><div><h1>${isEdit?'Edit':'Tambah'} Produk</h1><div class="muted">Harga ini akan menjadi harga default saat produk ditambahkan ke booking.</div></div></div>
 <div class="card"><form id="productForm"><div class="formgrid">
 <div class="field"><label>Nama Produk</label><input name="name" value="${esc(p.name)}" required></div>
 <div class="field"><label>Kategori</label><select name="category">${['Tiket','Makan','Add-on','Lainnya'].map(x=>`<option ${x===p.category?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Satuan</label><select name="unit">${['pax','orang','unit','bus','paket'].map(x=>`<option ${x===p.unit?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Harga</label><input type="number" min="0" name="price" value="${p.price||0}" required></div>
 <div class="field"><label>Status</label><select name="active"><option value="true" ${p.active?'selected':''}>Aktif</option><option value="false" ${!p.active?'selected':''}>Nonaktif</option></select></div>
 </div><div class="actions"><button type="button" class="btn" onclick="page='products';layout()">Batal</button><button class="btn primary">Simpan Produk</button></div></form></div>`;
 $('#productForm').onsubmit=e=>{e.preventDefault();let fd=Object.fromEntries(new FormData(e.target));let obj={...p,...fd,price:+fd.price||0,active:fd.active==='true'};if(isEdit){let i=db.products.findIndex(x=>x.id===p.id);db.products[i]=obj}else db.products.push(obj);save();page='products';layout();}
}
function toggleProduct(id){ if(!requireSuperAdmin()) return;let p=productById(id);p.active=!p.active;save();layout();}
function openDocs(id){editing=id;page='documents';layout();setTimeout(()=>{$('#docGroup').value=id;renderDocList()},0)}
function documents(){
 let first=editing||db.groups[0]?.id||'';
 $('#app').innerHTML=`<div class="top"><div><h1>Dokumen</h1><div class="muted">Dokumen otomatis berdasarkan detail item booking.</div></div></div>
 <div class="card no-print"><div class="formgrid"><div class="field"><label>Pilih Rombongan</label><select id="docGroup" onchange="renderDocList()"><option value="">-- pilih --</option>${db.groups.map(g=>`<option value="${g.id}" ${g.id===first?'selected':''}>${esc(g.code)} — ${esc(g.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Dokumen</label><select id="docKind"><option value="offering">Offering Letter</option><option value="confirmation">Confirmation Letter</option><option value="proforma">Proforma Invoice</option><option value="invoice">Invoice</option></select></div></div>
 <div class="actions"><button class="btn primary" onclick="generateDoc()">Tampilkan Dokumen</button></div></div><div id="docPreview" style="margin-top:18px"></div>`;renderDocList();
}
function renderDocList(){let g=db.groups.find(x=>x.id===$('#docGroup')?.value);if(g){let c=calcGroup(g);$('#docPreview').innerHTML=`<div class="card no-print"><b>${esc(g.name)}</b> · ${esc(g.code)} · ${g.pax||0} peserta · ${rupiah(c.total)} · ${g.items?.length||0} item</div>`}}
function generateDoc(){
 let g=db.groups.find(x=>x.id===$('#docGroup').value);if(!g){alert('Pilih rombongan.');return}
 let kind=$('#docKind').value,c=calcGroup(g);
 let title={offering:'OFFERING LETTER',confirmation:'CONFIRMATION LETTER',proforma:'PROFORMA INVOICE',invoice:'INVOICE'}[kind];
 let no=kind==='offering'?'OL-'+g.code:kind==='confirmation'?'CL-'+g.code:kind==='proforma'?'PI-'+g.code:'INV-'+g.code;
 let rows=(g.items||[]).map(i=>{
    let p=productById(i.productId), ic=itemCalc(i);
    return `<tr><td>${esc(p?.name||i.name||'Produk')}</td><td>${esc(p?.category||'')}</td><td>${i.qty}</td><td>${rupiah(i.price)}</td><td class="right">${rupiah(ic.gross)}</td><td class="right">${rupiah(ic.discount)}</td><td class="right">${rupiah(ic.total)}</td></tr>`;
  }).join('');
 $('#docPreview').innerHTML=`<div class="doc"><div class="dochead"><div><b>${esc(db.company.name)}</b><div class="muted">${esc(db.company.address)}</div><div class="muted">${esc(db.company.phone)} ${db.company.email?'· '+esc(db.company.email):''}</div></div><div class="right"><b>${no}</b><div>${fmtDate(new Date().toISOString().slice(0,10))}</div></div></div>
 <h2>${title}</h2><p>Kepada Yth.<br><b>${esc(g.contact||g.company||g.name)}</b><br>${esc(g.company||'')}</p>
 ${kind==='offering'?`<p>Berikut penawaran untuk rombongan <b>${esc(g.name)}</b> pada <b>${fmtDate(g.date)}</b> dengan jumlah peserta <b>${g.pax}</b> orang.</p>`:''}
 ${kind==='confirmation'?`<p>Dengan ini kami mengonfirmasi pemesanan rombongan <b>${esc(g.name)}</b> pada <b>${fmtDate(g.date)}</b> sebanyak <b>${g.pax}</b> peserta.</p>`:''}
 <table><thead><tr><th>Produk</th><th>Kategori</th><th>Qty</th><th>Harga</th><th>Subtotal</th></tr></thead><tbody>${rows}</tbody>
 <tr><td colspan="4" class="right"><b>Subtotal</b></td><td class="right">${rupiah(c.subtotal)}</td></tr>
 <tr><td colspan="4" class="right">Diskon</td><td class="right">${rupiah(c.discount)}</td></tr>
 <tr><td colspan="4" class="right">Pajak/Biaya</td><td class="right">${rupiah(c.tax)}</td></tr>
 <tr><td colspan="4" class="right"><b>Grand Total</b></td><td class="right"><b>${rupiah(c.total)}</b></td></tr>
 <tr><td colspan="4" class="right">DP</td><td class="right">${rupiah(c.dp)}</td></tr>
 <tr><td colspan="4" class="right"><b>Outstanding</b></td><td class="right"><b>${rupiah(c.balance)}</b></td></tr></table>
 <p><b>Tanggal kunjungan:</b> ${fmtDate(g.date)} &nbsp; <b>Jatuh tempo:</b> ${fmtDate(g.due)}</p>
 ${g.notes?`<p><b>Catatan:</b> ${esc(g.notes)}</p>`:''}
 <p>Dokumen ini diterbitkan dari sistem pengelolaan rombongan dan memuat item serta harga yang tersimpan pada booking.</p>
 <div style="margin-top:70px;display:flex;justify-content:space-between"><div>Pelanggan<br><br><br>(________________)</div><div>Hormat kami,<br><br><br>(________________)</div></div></div>
 <div class="actions no-print"><button class="btn" onclick="window.print()">🖨 Cetak / Simpan PDF</button></div>`;
}
function settings(){ if(!requireSuperAdmin()) return;
 let c=db.company;
 $('#app').innerHTML=`<div class="top"><div><h1>Pengaturan</h1><div class="muted">Identitas perusahaan pada dokumen.</div></div></div>
 <div class="card"><form id="settingsForm"><div class="formgrid"><div class="field"><label>Nama Perusahaan / Destinasi</label><input name="name" value="${esc(c.name)}" required></div><div class="field"><label>Telepon</label><input name="phone" value="${esc(c.phone)}"></div><div class="field"><label>Email</label><input name="email" value="${esc(c.email)}"></div><div class="field full"><label>Alamat</label><textarea name="address">${esc(c.address)}</textarea></div></div><div class="actions"><button class="btn primary">Simpan Pengaturan</button></div></form></div>
 <div class="card" style="margin-top:18px"><h3>Data</h3><p class="muted">Versi ini menyimpan data di browser menggunakan localStorage. Login sudah mendukung 2 role: Superadmin dan User Biasa. Data aplikasi masih tersimpan di localStorage browser.</p><button class="btn danger" onclick="if(requireSuperAdmin()&&confirm('Hapus semua booking?')){db.groups=[];save();layout()}">Hapus Semua Rombongan</button></div>`;
 $('#settingsForm').onsubmit=e=>{e.preventDefault();db.company={...db.company,...Object.fromEntries(new FormData(e.target))};save();alert('Pengaturan tersimpan.');layout();}
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  const target=b.dataset.page;
  if(b.dataset.role==='superadmin' && !isSuperAdmin()){
    alert('Menu ini hanya dapat diakses oleh Superadmin.');
    return;
  }
  page=target;layout();
});

$('#loginForm').onsubmit=e=>{
  e.preventDefault();
  const ok=login($('#loginUsername').value.trim(),$('#loginPassword').value);
  if(!ok){
    $('#loginError').style.display='block';
    $('#loginPassword').value='';
    $('#loginPassword').focus();
    return;
  }
  $('#loginError').style.display='none';
  e.target.reset();
  showApp();
};

if(currentUser) showApp(); else showLogin();
</script>
